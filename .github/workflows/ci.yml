name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # LayoutProps/PageProps are generated by Next, absent on a clean checkout.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Lint has pre-existing errors on main; make blocking once they are fixed.
      - run: npm run lint
        continue-on-error: true

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Full stack: migrations touch storage.buckets, which needs storage-api.
      - run: supabase start
      - run: supabase test db
